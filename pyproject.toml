[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panel-sentinel"
version = "0.2.0"
description = "Validate research panel CSVs before statistical modelling."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Wang Haoxuan"}]
dependencies = []

[project.scripts]
panel-sentinel = "panel_sentinel.cli:main"

[project.urls]
Repository = "https://github.com/jinxuansama/panel-sentinel"
Issues = "https://github.com/jinxuansama/panel-sentinel/issues"

[tool.setuptools.packages.find]
where = ["src"]
